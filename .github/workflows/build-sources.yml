name: Build SideStore sources

on:
  # Regenerate on a schedule so new app releases are picked up automatically.
  schedule:
    - cron: "*/10 * * * *"      # every 10 min. This is the SAFETY NET, not the main path:
                                # rebelancap/all-ports fans an app-released dispatch out to
                                # this repo on every release, so the normal case is seconds.
                                # The tight cron bounds the damage when that token is
                                # missing/expired/misscoped to ~10 min instead of ~1 h.
                                # Unchanged runs are ~free API calls.
  # Manual run button in the Actions tab.
  workflow_dispatch:
  # Optional: let an app repo trigger an immediate rebuild (see README).
  repository_dispatch:
    types: [app-released]

permissions:
  contents: write               # to commit the regenerated JSON

concurrency:
  group: build-sources
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # By name, not by github.sha: repository_dispatch pins the sha to whatever main
      # pointed at when the event was created, which can predate a commit an earlier
      # run has since pushed. Checking out the branch fetches the real head instead.
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate source JSON
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 generate.py

      # Losing a push race is not an error worth an email. Runs still overlap despite the
      # concurrency group above: all-ports fans an app-released dispatch out to this repo
      # once per surviving run of ITS OWN workflow, so a batch release delivers several
      # dispatches seconds apart on top of the cron. The second starts from a stale base
      # and gets rejected. generate.py is deterministic, so replaying our output onto
      # whatever landed converges; usually to "no changes at all".
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            if [ -z "$(git status --porcelain apps-ios.json apps-visionos.json)" ]; then
              echo "No changes."
              exit 0
            fi
            git add apps-ios.json apps-visionos.json
            git commit -m "chore: refresh SideStore sources"
            if git push; then
              exit 0
            fi

            echo "push rejected (attempt $attempt of 3) — replaying onto the new head"
            # Deliberately not a rebase: both sides rewrote the same generated JSON, so a
            # rebase conflicts every time. Keep our files, drop our commit, start again on
            # the new head. Reset is safe because only these two files are ever generated.
            cp apps-ios.json apps-visionos.json "$RUNNER_TEMP/"
            git fetch origin main
            git reset --hard FETCH_HEAD
            cp "$RUNNER_TEMP/apps-ios.json" "$RUNNER_TEMP/apps-visionos.json" .
          done

          echo "::error::could not push after 3 attempts"
          exit 1
